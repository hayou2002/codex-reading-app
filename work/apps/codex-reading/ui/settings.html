<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Codex 会话</title>
  <link rel="stylesheet" href="./settings.css" />
</head>
<body>
  <main class="page">
    <p class="intro">回复风格、字体和排版。保存后约 2 秒应用到聊天；首次安装外观补丁后需要重启一次 Hana。</p>

    <section class="section">
      <div class="section-head">
        <h2>外观补丁</h2>
        <span class="badge" id="patch-badge">读取中</span>
      </div>
      <p class="section-desc">把字体、字号、行高、列宽、链接和代码样式作用到 Hana 的回复区，可随时恢复。</p>
      <div class="panel">
        <div class="panel-body">
          <div class="button-row">
            <button class="btn primary" id="apply-btn" type="button">应用 Codex 外观</button>
            <button class="btn" id="restore-btn" type="button">恢复 Hana 原样</button>
          </div>
          <p class="status" id="patch-status" role="status"></p>
        </div>
      </div>
    </section>

    <div id="groups"></div>

    <footer class="page-foot">
      <button class="btn primary" id="save-btn" type="button">保存设置</button>
      <span class="status" id="save-status" role="status"></span>
    </footer>
  </main>
  <script type="module" src="./settings.js"></script>
</body>
</html>
