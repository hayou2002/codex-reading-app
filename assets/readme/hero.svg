<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Codex 会话 · Hana 扩展</title>
  <desc id="heroDesc">七个 Codex 风格、五组语气滑杆和字体排版设置，作用在 Hana 自己的会话里。</desc>

  <defs>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="400" fill="#F8F2E8" />

  <g class="ui">
    <text x="64" y="100" font-size="18" letter-spacing="2" fill="#8A8175">HANA V2 APP · 回复风格层</text>

    <text x="64" y="178" font-size="56" font-weight="700" fill="#2E2823" letter-spacing="-1">Codex 会话</text>
    <rect x="66" y="198" width="80" height="3" rx="1.5" fill="#6F9075" />

    <text x="64" y="248" font-size="22" fill="#4A443C">七个风格、五组滑杆，字体与排版</text>
    <text x="64" y="282" font-size="22" fill="#4A443C">一起搬进 Hana 的原会话。</text>

    <text x="64" y="330" font-size="18" fill="#8A8175">默认停在 Hana 原生，不注入提示词。</text>
  </g>

  <g>
    <rect x="700" y="64" width="436" height="280" rx="16" fill="#FFFDF9" stroke="#E6DCCC" stroke-width="1" />

    <g class="ui">
      <circle cx="726" cy="104" r="4" fill="#6F9075" />
      <text x="740" y="109" font-size="18" fill="#8A8175">Hana · 会话</text>

      <rect x="1000" y="126" width="112" height="44" rx="14" fill="#EFE6D7" />
      <text x="1056" y="155" font-size="20" fill="#3A342D" text-anchor="middle">说短一点</text>

      <circle cx="736" cy="200" r="10" fill="#E7EEE6" />
      <circle cx="736" cy="200" r="3.4" fill="#6F9075" />
      <text x="756" y="206" font-size="18" font-weight="600" fill="#2E2823">阿念</text>

      <rect x="1008" y="186" width="104" height="28" rx="14" fill="#E7EEE6" />
      <text x="1024" y="205" font-size="18" fill="#4F7256">高效务实</text>

      <text x="756" y="248" font-size="24" font-weight="600" fill="#2E2823">今天的记录</text>

      <circle cx="762" cy="275" r="2.8" fill="#8A8175" />
      <text x="776" y="282" font-size="20" fill="#3A342D">三条记录已归档。</text>

      <circle cx="762" cy="307" r="2.8" fill="#8A8175" />
      <text x="776" y="314" font-size="20" fill="#3A342D">明天先做 P14 三道题。</text>
    </g>
  </g>

  <g class="ui">
    <text x="1136" y="374" font-size="18" fill="#8A8175" text-anchor="end">正文 16px · 行高 1.75 · 列宽 720</text>
  </g>
